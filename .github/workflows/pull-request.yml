name: PR Build Test

on:
  pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Image
    strategy:
      matrix:
        arch: [linux/amd64, linux/arm/v7, linux/arm64, linux/arm/v6]
    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Enable qemu
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build docker image
        run: |
          docker build -t diyhue/core:ci -f ./.build/Dockerfile --platform=${{ matrix.arch }} --build-arg TARGETPLATFORM=${{ matrix.arch }} .

      - name: Run docker image
        run: |
          docker run -d --name diyHue --network=host -v /mnt/hue-emulator/export:/opt/hue-emulator/export -e MAC=b8:27:eb:d4:dc:11 -e IP=192.168.1.123 -e DECONZ=192.168.1.111 -e IP_RANGE=5,6 -e DEBUG=true diyhue/core:ci
          sleep 15
          docker logs diyHue

      - name: Cleanup
        run: |
          docker kill diyHue
          docker rm diyHue

  motionaware-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run MotionAware regression tests
        run: python -m unittest discover -s tests -p "test_motion_aware_*.py" -v
